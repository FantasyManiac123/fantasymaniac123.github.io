<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#675d9b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
    <link rel="icon" href="./icons/icon-192.png" type="image/png">
    <title>Knižnica gamebookov</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body class="library-page">
    <header class="site-header">
        <div>
            <p class="eyebrow">Open Gamebook Reader</p>
            <h1>Knižnica</h1>
            <span class="subtitle">Vyber si príbeh a pokračuj tam, kde si skončil.</span>
        </div>

        <div class="header-actions">
            <button id="installButton" class="install-button" type="button" hidden>Pridať na plochu</button>
            <button id="themeButton" class="icon-button" type="button" aria-label="Prepnúť svetlú a tmavú tému" title="Prepnúť tému"></button>
        </div>
    </header>

    <main class="library-main">
        <section id="library" aria-live="polite"></section>
    </main>

    <div id="message" role="status" aria-live="polite"></div>

    <div id="installHelp" class="install-help" hidden aria-hidden="true">
        <div class="install-help-card" role="dialog" aria-modal="true" aria-labelledby="installHelpTitle">
            <button id="closeInstallHelp" class="install-help-close" type="button" aria-label="Zavrieť">×</button>
            <h2 id="installHelpTitle">Pridať na plochu</h2>
            <p>V Safari otvor ponuku <strong>Zdieľať</strong> a vyber <strong>Pridať na plochu</strong>.</p>
        </div>
    </div>

    <script src="./app.js"></script>
    <script src="./pwa.js"></script>
</body>
</html>
